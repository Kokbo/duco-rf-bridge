; duco-rf-bridge firmware: one project, two firmwares sharing lib/duco.
;
;   pio run -e sniffer -t upload -t monitor    ; step 1: learn your network (receive only)
;   pio run -e bridge  -t upload -t monitor    ; step 2: replace the box (needs src/bridge/config.h)
;
; Serial logs land in logs/ (git-ignored). If upload can't find the board, add
; upload_port / monitor_port (e.g. COM3 or /dev/ttyUSB0) to the env you use.

[platformio]
default_envs = bridge

[env]
platform = espressif32@6.9.0
board = ttgo-lora32-v21            ; LilyGO T3 v1.6.1 (TTGO LoRa32 V2.1_1.6), 868 MHz version
framework = arduino
monitor_speed = 115200
monitor_filters = default, log2file
lib_deps =
    jgromes/RadioLib@7.1.2

[env:bridge]
build_src_filter = +<bridge/>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.2

[env:sniffer]
build_src_filter = +<sniffer/>
monitor_echo = yes                 ; show the MARK characters you type
